[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentik-decisions"
version = "0.21.15"
description = "Six verbs over one sectioned DECISIONS.md per repo: show, find, new, ask, answer and render, plus doctor and backlog."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
agentik-decisions = "decisions.cli:main"
# The old name, an alias until 2026-12-31 (agentik-r1 section 4.3); r2 removes it.
decisions = "decisions.cli:main"

[tool.setuptools]
package-dir = {"" = "plugin/lib"}
packages = ["decisions"]
